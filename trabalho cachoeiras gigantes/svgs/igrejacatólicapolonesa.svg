    <g transform="translate(80, 80)">
      <ellipse cx="0" cy="0" rx="45" ry="15"/>
      <ellipse cx="20" cy="-8" rx="30" ry="18"/>
      <ellipse cx="-15" cy="-3" rx="28" ry="14"/>
      <ellipse cx="5" cy="5" rx="35" ry="10"/>
    </g>
    <g transform="translate(420, 100)">
      <ellipse cx="0" cy="0" rx="50" ry="16"/>
      <ellipse cx="-20" cy="-8" rx="32" ry="18"/>
      <ellipse cx="15" cy="-4" rx="30" ry="14"/>
      <ellipse cx="-5" cy="6" rx="38" ry="11"/>
    </g>
    <g transform="translate(250, 50) scale(0.7)">
      <ellipse cx="0" cy="0" rx="40" ry="12"/>
      <ellipse cx="15" cy="-6" rx="25" ry="14"/>
      <ellipse cx="-12" cy="-3" rx="22" ry="11"/>
    </g>
  </g>

  <!-- GRAMA -->
  <rect x="0" y="480" width="500" height="120" fill="url(#grassCh)"/>
  <rect x="0" y="480" width="500" height="5" fill="#5A9030"/>

  <!-- Detalhes de grama -->
  <g stroke="#3A6018" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M 20 500 Q 25 495 30 500"/>
    <path d="M 80 510 Q 85 505 90 510"/>
    <path d="M 150 505 Q 155 500 160 505"/>
    <path d="M 340 505 Q 345 500 350 505"/>
    <path d="M 420 515 Q 425 510 430 515"/>
    <path d="M 470 500 Q 475 495 480 500"/>
  </g>

  <!-- ÁRVORES mais realistas (esquerda) -->
  <g transform="translate(55, 460)">
    <ellipse cx="0" cy="5" rx="30" ry="8" fill="#2A4010" opacity="0.4"/>
    <rect x="-6" y="-30" width="12" height="35" fill="#5A3A1A" stroke="#3A2510" stroke-width="1.5"/>
    <!-- Galhos -->
    <path d="M -6 -20 L -15 -25" stroke="#5A3A1A" stroke-width="3" fill="none"/>
    <path d="M 6 -22 L 15 -28" stroke="#5A3A1A" stroke-width="3" fill="none"/>
    <!-- Copa em camadas -->
    <ellipse cx="0" cy="-55" rx="40" ry="35" fill="url(#treeFoliage)" stroke="#1A4010" stroke-width="1.5"/>
    <ellipse cx="-15" cy="-45" rx="25" ry="22" fill="#5AA840" opacity="0.6"/>
    <ellipse cx="15" cy="-48" rx="22" ry="20" fill="#5AA840" opacity="0.5"/>
    <ellipse cx="0" cy="-70" rx="28" ry="20" fill="#6AB850" opacity="0.7"/>
    <!-- Detalhes de folhas -->
