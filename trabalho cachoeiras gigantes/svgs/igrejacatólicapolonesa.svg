    <path d="M 6 -22 L 15 -28" stroke="#5A3A1A" stroke-width="3" fill="none"/>
    <ellipse cx="0" cy="-55" rx="40" ry="35" fill="url(#treeFoliage)" stroke="#1A4010" stroke-width="1.5"/>
    <ellipse cx="-15" cy="-45" rx="25" ry="22" fill="#5AA840" opacity="0.6"/>
    <ellipse cx="15" cy="-48" rx="22" ry="20" fill="#5AA840" opacity="0.5"/>
    <ellipse cx="0" cy="-70" rx="28" ry="20" fill="#6AB850" opacity="0.7"/>
    <g fill="#4A9030" opacity="0.5">
      <circle cx="-20" cy="-60" r="3"/>
      <circle cx="15" cy="-65" r="3"/>
      <circle cx="22" cy="-52" r="2.5"/>
    </g>
  </g>

  <!-- CAMINHO -->
  <path d="M 200 600 L 225 480 L 275 480 L 300 600 Z" fill="#D8C8A8"/>
  <path d="M 200 600 L 225 480 L 275 480 L 300 600 Z" fill="none" stroke="#A89880" stroke-width="2"/>
  <g stroke="#B8A888" stroke-width="1" fill="none" opacity="0.7">
