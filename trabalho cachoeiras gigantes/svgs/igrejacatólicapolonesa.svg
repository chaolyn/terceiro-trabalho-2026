      <line x1="127" y1="266" x2="127" y2="331" stroke="#8B7355" stroke-width="1"/>

      <path d="M 112 360 L 112 410 Q 112 423 127 423 Q 142 423 142 410 L 142 360 Q 127 348 112 360 Z"
