    <rect x="165" y="200" width="170" height="280" fill="url(#stoneWal)" stroke="#8B7355" stroke-width="2.5"/>

    <!-- Textura de pedra -->
    <g stroke="#B8A888" stroke-width="0.8" fill="none" opacity="0.5">
      <line x1="165" y1="225" x2="335" y2="225"/>
      <line x1="165" y1="250" x2="335" y2="250"/>
      <line x1="165" y1="275" x2="335" y2="275"/>
      <line x1="165" y1="300" x2="335" y2="300"/>
      <line x1="165" y1="325" x2="335" y2="325"/>
      <line x1="165" y1="350" x2="335" y2="350"/>
      <line x1="165" y1="375" x2="335" y2="375"/>
      <line x1="165" y1="400" x2="335" y2="400"/>
      <line x1="165" y1="425" x2="335" y2="425"/>
      <line x1="165" y1="450" x2="335" y2="450"/>
