    <linearGradient id="skyCh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BB8E0"/>
      <stop offset="40%" stop-color="#A8D8EA"/>
      <stop offset="100%" stop-color="#E8F4FA"/>
    </linearGradient>
    <linearGradient id="stoneWal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0DC"/>
      <stop offset="50%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#C8B898"/>
    </linearGradient>
    <linearGradient id="roofCh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B83030"/>
      <stop offset="50%" stop-color="#8B1818"/>
      <stop offset="100%" stop-color="#5A0808"/>
    </linearGradient>
    <linearGradient id="windowCh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BB8E0"/>
      <stop offset="100%" stop-color="#1C3F6E"/>
    </linearGradient>
    <linearGradient id="goldCh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="grassCh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88C050"/>
      <stop offset="100%" stop-color="#4A7028"/>
    </linearGradient>
    <linearGradient id="treeFoliage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AA840"/>
      <stop offset="100%" stop-color="#2E6018"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
