      <circle cx="0" cy="0" r="44" fill="none" stroke="#C81818" stroke-width="2"/>
      <circle cx="0" cy="0" r="40" fill="#1C3F6E"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#FFD700" stroke-width="1.8"/>
