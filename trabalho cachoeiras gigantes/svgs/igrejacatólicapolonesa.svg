    <g stroke="#7A5230" stroke-width="0.7" fill="none" opacity="0.6">
      <line x1="234" y1="390" x2="234" y2="480"/>
      <line x1="241" y1="390" x2="241" y2="480"/>
      <line x1="259" y1="390" x2="259" y2="480"/>
      <line x1="266" y1="390" x2="266" y2="480"/>
