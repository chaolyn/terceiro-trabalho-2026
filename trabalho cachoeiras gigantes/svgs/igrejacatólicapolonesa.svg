        <rect x="-2.5" y="-25" width="5" height="32" fill="url(#goldCh)" stroke="#6B5010" stroke-width="1"/>
        <rect x="-11" y="-18" width="22" height="5" fill="url(#goldCh)" stroke="#6B5010" stroke-width="1"/>
        <circle cx="0" cy="-25" r="3" fill="#FFE870" stroke="#6B5010" stroke-width="1"/>
