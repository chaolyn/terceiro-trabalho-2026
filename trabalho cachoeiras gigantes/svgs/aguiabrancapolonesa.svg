<svg width="400" height="480" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldRed2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC143C"/>
      <stop offset="50%" stop-color="#B01030"/>
      <stop offset="100%" stop-color="#7A0A20"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="eagleWhite2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0E8"/>
      <stop offset="100%" stop-color="#C8C8C0"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="480" fill="#F5EFE6"/>

  <!-- ESCUDO -->
  <g filter="url(#shadow2)">
    <path d="M 60 60 L 340 60 L 340 280
             Q 340 380 200 430
             Q 60 380 60 280 Z"
          fill="url(#shieldRed2)" stroke="#5A0010" stroke-width="5"/>
    <path d="M 75 75 L 325 75 L 325 278
             Q 325 368 200 415
             Q 75 368 75 278 Z"
          fill="none" stroke="url(#gold2)" stroke-width="3"/>
  </g>

  <!-- ÁGUIA -->
  <g transform="translate(200, 240)">

    <!-- CAUDA (5 penas em leque) -->
    <path d="M -35 70 L -55 175 L -25 100 Z" fill="url(#eagleWhite2)" stroke="#666" stroke-width="2"/>
    <path d="M -18 75 L -28 185 L -8 100 Z" fill="url(#eagleWhite2)" stroke="#666" stroke-width="2"/>
    <path d="M 0 78 L 0 190 L 0 100 Z" fill="url(#eagleWhite2)" stroke="#666" stroke-width="2"/>
    <path d="M 18 75 L 28 185 L 8 100 Z" fill="url(#eagleWhite2)" stroke="#666" stroke-width="2"/>
    <path d="M 35 70 L 55 175 L 25 100 Z" fill="url(#eagleWhite2)" stroke="#666" stroke-width="2"/>
    <g stroke="#A8A8A0" stroke-width="1" fill="none">
      <path d="M -30 90 L -48 165"/>
      <path d="M -15 95 L -25 175"/>
      <path d="M 15 95 L 25 175"/>
      <path d="M 30 90 L 48 165"/>
    </g>

    <!-- ASAS (3 camadas sobrepostas) -->
    <!-- Camada 1: penas de cobertura (mais curtas, próximas ao corpo) -->
    <path d="M -30 0
             Q -60 -5 -90 5
             Q -70 25 -55 30
             Q -45 20 -30 15 Z"
          fill="#E8E8E0" stroke="#999" stroke-width="1.5"/>
    <path d="M 30 0
             Q 60 -5 90 5
             Q 70 25 55 30
             Q 45 20 30 15 Z"
          fill="#E8E8E0" stroke="#999" stroke-width="1.5"/>

    <!-- Camada 2: penas secundárias (médias) -->
    <path d="M -30 -5
             Q -95 -20 -155 -10
             Q -140 15 -110 25
             Q -70 25 -40 15 Z"
          fill="#F5F5F0" stroke="#777" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 30 -5
             Q 95 -20 155 -10
             Q 140 15 110 25
             Q 70 25 40 15 Z"
          fill="#F5F5F0" stroke="#777" stroke-width="2" stroke-linejoin="round"/>

    <!-- Camada 3: penas primárias (longas, ponta da asa) -->
    <path d="M -30 -10
             Q -110 -25 -190 -5
             Q -200 10 -195 25
             Q -180 35 -160 35
             Q -140 45 -125 50
             Q -100 55 -80 50
             Q -55 40 -35 20 Z"
          fill="url(#eagleWhite2)" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30 -10
             Q 110 -25 190 -5
             Q 200 10 195 25
             Q 180 35 160 35
             Q 140 45 125 50
             Q 100 55 80 50
             Q 55 40 35 20 Z"
          fill="url(#eagleWhite2)" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Divisões das penas primárias -->
    <g stroke="#A8A8A0" stroke-width="1.5" fill="none">
      <path d="M -80 -15 Q -125 -15 -165 -3"/>
      <path d="M -80 -3 Q -130 2 -170 12"/>
      <path d="M -80 10 Q -125 20 -160 28"/>
      <path d="M -70 22 Q -105 35 -135 42"/>
      <path d="M 80 -15 Q 125 -15 165 -3"/>
      <path d="M 80 -3 Q 130 2 170 12"/>
      <path d="M 80 10 Q 125 20 160 28"/>
      <path d="M 70 22 Q 105 35 135 42"/>
    </g>

    <!-- PERNAS (mais grossas) -->
    <path d="M -20 60 L -30 95 Q -32 105 -28 110 L -22 108 Q -18 100 -14 90 Z"
          fill="#C8A030" stroke="#6B5010" stroke-width="1.5"/>
    <path d="M 20 60 L 30 95 Q 32 105 28 110 L 22 108 Q 18 100 14 90 Z"
          fill="#C8A030" stroke="#6B5010" stroke-width="1.5"/>

    <!-- GARRAS (maiores) -->
    <g fill="url(#gold2)" stroke="#6B5010" stroke-width="1.2">
      <!-- Garra esquerda -->
      <path d="M -30 105 Q -50 112 -48 125 L -40 118 Q -35 112 -30 110 Z"/>
      <path d="M -28 108 Q -40 120 -36 132 L -30 122 Z"/>
      <path d="M -24 108 Q -28 122 -22 132 L -20 120 Z"/>
      <!-- Garra direita -->
      <path d="M 30 105 Q 50 112 48 125 L 40 118 Q 35 112 30 110 Z"/>
      <path d="M 28 108 Q 40 120 36 132 L 30 122 Z"/>
      <path d="M 24 108 Q 28 122 22 132 L 20 120 Z"/>
    </g>

    <!-- CORPO (mais largo) -->
    <path d="M -35 -25
             Q -48 15 -42 55
             Q -35 85 -20 100
             L -15 108
             Q 0 115 15 108
             L 20 100
             Q 35 85 42 55
             Q 48 15 35 -25 Z"
          fill="url(#eagleWhite2)" stroke="#555" stroke-width="2.5"/>

    <!-- Penas do peito (escamas maiores) -->
    <g stroke="#B8B8B0" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M -25 -15 Q -12 -8 -2 -18 Q 8 -8 25 -15"/>
      <path d="M -28 0 Q -12 8 -2 -2 Q 8 8 28 0"/>
      <path d="M -30 15 Q -12 23 -2 13 Q 8 23 30 15"/>
      <path d="M -30 30 Q -12 38 -2 28 Q 8 38 30 30"/>
      <path d="M -28 45 Q -12 53 -2 43 Q 8 53 28 45"/>
      <path d="M -25 60 Q -12 68 -2 58 Q 8 68 25 60"/>
      <path d="M -20 75 Q -10 82 0 73 Q 10 82 20 75"/>
    </g>

    <!-- SOMBRAS INTERNAS (profundidade) -->
    <path d="M -35 -25 Q -48 15 -42 55 Q -38 70 -32 80 Q -25 55 -22 15 Q -25 -15 -35 -25 Z"
          fill="#C0C0B8" opacity="0.3"/>
    <path d="M 35 -25 Q 48 15 42 55 Q 38 70 32 80 Q 25 55 22 15 Q 25 -15 35 -25 Z"
          fill="#C0C0B8" opacity="0.3"/>

    <!-- PESCOÇO -->
    <path d="M -15 -30 Q -18 -45 -12 -55 L 12 -55 Q 18 -45 15 -30 Z"
          fill="url(#eagleWhite2)" stroke="#555" stroke-width="1.5"/>

    <!-- CABEÇA (mais angular, formato de águia) -->
    <path d="M -22 -60
             Q -25 -75 -18 -85
             Q -10 -95 0 -95
             Q 12 -95 18 -85
             Q 25 -75 22 -60
             Q 15 -55 0 -55
             Q -15 -55 -22 -60 Z"
          fill="url(#eagleWhite2)" stroke="#555" stroke-width="2"/>

    <!-- Sobrancelha marcada (dá cara de raptor) -->
    <path d="M -15 -82 Q -5 -88 8 -84" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>

    <!-- Sombra sob a cabeça -->
    <path d="M -18 -75 Q 0 -68 18 -75 Q 10 -60 0 -58 Q -10 -60 -18 -75 Z"
          fill="#C0C0B8" opacity="0.3"/>

    <!-- BICO (grande, curvo, de raptor) -->
    <path d="M 0 -80
             Q 15 -82 28 -75
             Q 38 -70 42 -60
             Q 42 -55 38 -52
             Q 30 -50 22 -55
             Q 12 -60 4 -68
             Q 0 -74 0 -80 Z"
          fill="url(#gold2)" stroke="#6B5010" stroke-width="2" stroke-linejoin="round"/>
    <!-- Detalhe da curva do bico -->
    <path d="M 15 -70 Q 25 -70 35 -62" fill="none" stroke="#6B5010" stroke-width="1.2"/>
    <!-- Abertura do bico -->
    <path d="M 8 -62 Q 15 -60 22 -60" fill="none" stroke="#6B5010" stroke-width="1"/>
    <!-- Narina -->
    <ellipse cx="8" cy="-76" rx="2.5" ry="1.5" fill="#6B5010"/>

    <!-- OLHO (com íris dourada pequena, cara de águia) -->
    <ellipse cx="10" cy="-72" rx="4" ry="3.5" fill="#1A1A1A"/>
    <circle cx="10.5" cy="-72.5" r="1.2" fill="#FFD700"/>
    <circle cx="11" cy="-73" r="0.5" fill="#FFFFFF"/>

    <!-- COROA -->
    <g transform="translate(0, -95)">
      <path d="M -25 0 Q 0 -4 25 0 L 25 7 Q 0 3 -25 7 Z"
            fill="url(#gold2)" stroke="#6B5010" stroke-width="1.5"/>

      <path d="M -25 0
               L -27 -12 L -20 -5
               L -18 -16 L -11 -6
               L -8 -20 L -2 -7
               L 0 -22 L 2 -7
               L 8 -20 L 11 -6
               L 18 -16 L 20 -5
               L 27 -12 L 25 0 Z"
            fill="url(#gold2)" stroke="#6B5010" stroke-width="1.3" stroke-linejoin="round"/>

      <g fill="#FFFFFF" stroke="#8B6914" stroke-width="0.8">
        <circle cx="-20" cy="-2" r="2"/>
        <circle cx="-13" cy="-2" r="2"/>
        <circle cx="-7" cy="-2" r="2"/>
        <circle cx="0" cy="-2" r="2.2"/>
        <circle cx="7" cy="-2" r="2"/>
        <circle cx="13" cy="-2" r="2"/>
        <circle cx="20" cy="-2" r="2"/>
      </g>

      <g>
        <circle cx="-18" cy="-9" r="2" fill="#DC143C"/>
        <circle cx="-9" cy="-11" r="2" fill="#1C3F6E"/>
        <circle cx="0" cy="-14" r="2.5" fill="#DC143C"/>
        <circle cx="9" cy="-11" r="2" fill="#1C3F6E"/>
        <circle cx="18" cy="-9" r="2" fill="#DC143C"/>
      </g>

      <rect x="-1.8" y="-34" width="3.6" height="14" fill="url(#gold2)" stroke="#6B5010" stroke-width="0.9"/>
      <rect x="-7" y="-30" width="14" height="3.6" fill="url(#gold2)" stroke="#6B5010" stroke-width="0.9"/>
      <circle cx="0" cy="-35" r="1.8" fill="#FFD700" stroke="#6B5010" stroke-width="0.7"/>
    </g>
  </g>

  <!-- FAIXA -->
  <rect x="60" y="445" width="280" height="10" fill="#FFFFFF" stroke="#999" stroke-width="1"/>
  <rect x="60" y="455" width="280" height="10" fill="#DC143C"/>

  <!-- ESTRELAS -->
  <g fill="url(#gold2)" opacity="0.85">
    <path d="M 85 85 L 88 92 L 96 92 L 90 97 L 92 105 L 85 100 L 78 105 L 80 97 L 74 92 L 82 92 Z"/>
    <path d="M 315 85 L 318 92 L 326 92 L 320 97 L 322 105 L 315 100 L 308 105 L 310 97 L 304 92 L 312 92 Z"/>
  </g>
</svg>
